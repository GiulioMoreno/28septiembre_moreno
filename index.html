<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Diagramas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #330000;
            margin-bottom: 25px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }

        .avatar {
            width: 35px;
            height: 35px;
            background: #dc2626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: bold;
        }

        .clock-box {
            text-align: right;
            font-family: monospace;
        }

        .time {
            font-size: 1.2rem;
            color: #ef4444;
            font-weight: bold;
        }

        .date {
            font-size: 0.8rem;
            color: #a3a3a3;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #dc2626;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- MENÚ DE NAVEGACIÓN --- */
        .diagram-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 2px solid #991b1b;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background-color: #991b1b;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background-color: #dc2626;
            border-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
        }

        /* --- CONTENEDORES DE DIAGRAMAS --- */
        .diagram-panel {
            display: none;
            background: #141414;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 20px;
        }

        .diagram-panel.active {
            display: block;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #7f1d1d;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            color: #f87171;
            font-size: 1.3rem;
        }

        .btn-view {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #dc2626;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-view:hover {
            background-color: #b91c1c;
            transform: translateY(-1px);
        }

        .iframe-container {
            width: 100%;
            height: 650px;
            background: #000000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #333333;
        }

        .iframe-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #525252;
            font-size: 0.85rem;
        }
    </style>
</head>

    <script>
        function showDiagram(id, btn) {
            const panels = document.querySelectorAll('.diagram-panel');
            panels.forEach(panel => panel.classList.remove('active'));

            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(b => b.classList.remove('active'));

            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function updateClock() {
            const now = new Date();
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'p.m.' : 'a.m.';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            const strHours = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${strHours}:${minutes}:${seconds} ${ampm}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let dateStr = now.toLocaleDateString('es-ES', options);
            dateStr = dateStr.replace(/^./, str => str.toUpperCase());
            
            document.getElementById('date').textContent = dateStr;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
