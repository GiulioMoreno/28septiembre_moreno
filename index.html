    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }

        .avatar {
            width: 35px;
            height: 35px;
            background: #a855f7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clock-box {
            text-align: right;
            font-family: monospace;
        }

        .time {
            font-size: 1.2rem;
            color: #38bdf8;
            font-weight: bold;
        }

        .date {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #f97316;
        }

        .section-title {
            margin: 30px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 2px solid #334155;
            color: #38bdf8;
        }

        .iframe-container {
            width: 100%;
            height: 600px;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        /* Fuerza a que el iframe pegado ocupe todo el espacio */
        .iframe-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>

    <script>
        function updateClock() {
            const now = new Date();
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'p.m.' : 'a.m.';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            const strHours = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${strHours}:${minutes}:${seconds} ${ampm}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let dateStr = now.toLocaleDateString('es-ES', options);
            dateStr = dateStr.replace(/^./, str => str.toUpperCase());
            
            document.getElementById('date').textContent = dateStr;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
